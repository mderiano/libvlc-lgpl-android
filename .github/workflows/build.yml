name: Build libvlc (LGPL)

# Builds LibVLC for Android without any GPL component, in VideoLAN's own public
# build image, then audits the result (check-no-gpl.sh). One ABI takes 1 to 2 hours.
#
#   abi = all (default): builds arm64-v8a, armeabi-v7a and x86_64 in parallel, audits each,
#         then the "assemble" job merges them into ONE AAR (libvlc-lgpl-<version>-<license>.aar)
#         and publishes ONE release, if and only if the three audits pass.
#   abi = one ABI: a trial build with its own AAR and audit, no assembly, no release.
#
# See README.md.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Android ABI: all = the three ABIs, one AAR, one release; or a single ABI for a trial"
        type: choice
        options: [all, arm64-v8a, armeabi-v7a, x86_64]
        default: all
      license:
        description: "libvlcjni --license: l = LGPL 3 (GnuTLS, https works), a = LGPL 2.1 (no TLS)"
        type: choice
        options: [l, a]
        default: l
      release:
        description: "Publish a GitHub release when the three audits pass (abi = all only)"
        type: boolean
        default: true
      release_tag:
        description: "Tag to create (empty: the next v3.7.0-lgpl.N). Never overwrites an existing release."
        type: string
        default: ""

run-name: libvlc LGPL ${{ inputs.abi }} / license ${{ inputs.license }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan the ABIs
    runs-on: ubuntu-latest
    outputs:
      abis: ${{ steps.p.outputs.abis }}
    steps:
      - id: p
        env:
          ABI_INPUT: ${{ inputs.abi }}
        run: |
          if [ "$ABI_INPUT" = all ]; then
            echo 'abis=["arm64-v8a","armeabi-v7a","x86_64"]' >> "$GITHUB_OUTPUT"
          else
            echo "abis=[\"$ABI_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: libvlc ${{ matrix.abi }} (license ${{ inputs.license }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false   # keep the other ABIs running: a failed ABI still leaves its log and audit
      matrix:
        abi: ${{ fromJSON(needs.plan.outputs.abis) }}
    env:
      ABI: ${{ matrix.abi }}
      LICENSE_FLAG: ${{ inputs.license }}
    steps:
      - name: Checkout the recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/julia* /opt/microsoft /usr/lib/google-cloud-sdk
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Pick the build image and the pins
        id: pins
        run: |
          # The two images libvlcjni's own .gitlab-ci.yml uses at the pinned commit:
          # 64-bit ABIs need NDK 27/28 (vlc-debian-android: NDK 28b, Gradle 8.13),
          # armeabi-v7a needs NDK 21 (vlc-debian-android-3.0: NDK 21e, Gradle 8.13).
          # Both are public on registry.videolan.org (no authentication).
          if [ "$ABI" = armeabi-v7a ]; then
            echo "image=registry.videolan.org/vlc-debian-android-3.0:20250626142950" >> "$GITHUB_OUTPUT"
          else
            echo "image=registry.videolan.org/vlc-debian-android:20250626142950" >> "$GITHUB_OUTPUT"
          fi
          echo "vlc=$(sed -n 's/^VLC_COMMIT=//p' build.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore the contrib source tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tarballs
          key: vlc-contrib-tarballs-${{ steps.pins.outputs.vlc }}-${{ matrix.abi }}
          restore-keys: |
            vlc-contrib-tarballs-${{ steps.pins.outputs.vlc }}-

      - name: Pull the build image
        run: docker pull "${{ steps.pins.outputs.image }}"

      - name: Build and audit
        run: |
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/out" "$RUNNER_TEMP/tarballs"
          chmod 777 "$RUNNER_TEMP/work" "$RUNNER_TEMP/out" "$RUNNER_TEMP/tarballs"
          chmod -R a+rwX "$RUNNER_TEMP/tarballs" || true
          # The image's own user (uid 499, "videolan") runs the build, as in VideoLAN's CI.
          docker run --rm \
            -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_SHA \
            -e VLC_TARBALLS=/tarballs \
            -v "$GITHUB_WORKSPACE:/recipe:ro" \
            -v "$RUNNER_TEMP/work:/work" \
            -v "$RUNNER_TEMP/out:/out" \
            -v "$RUNNER_TEMP/tarballs:/tarballs" \
            -w /work \
            "${{ steps.pins.outputs.image }}" \
            bash /recipe/build.sh --abi "$ABI" --license "$LICENSE_FLAG" --work /work --out /out

      - name: Compress the build log
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/out/build.log" ]; then gzip -9 -k -f "$RUNNER_TEMP/out/build.log"; fi
          df -h /
          ls -la "$RUNNER_TEMP/out" || true

      - name: Job summary
        if: always()
        run: |
          {
            echo "### libvlc LGPL ${ABI} (license ${LICENSE_FLAG})"
            if [ -f "$RUNNER_TEMP/out/LICENSE-AUDIT.txt" ]; then
              echo '```'
              grep -E '^(  FAIL|  warn|PASS|FAIL|LICENSE AUDIT)' "$RUNNER_TEMP/out/LICENSE-AUDIT.txt" | head -n 60
              echo '```'
            else
              echo "No LICENSE-AUDIT.txt: the build stopped before the audit (see the build log artifact)."
            fi
            [ -f "$RUNNER_TEMP/out/SHA256SUMS.txt" ] && { echo '```'; cat "$RUNNER_TEMP/out/SHA256SUMS.txt"; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the AAR and the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libvlc-lgpl-${{ matrix.abi }}-${{ inputs.license }}
          path: |
            ${{ runner.temp }}/out/*.aar
            ${{ runner.temp }}/out/BUILD-INFO.txt
            ${{ runner.temp }}/out/SHA256SUMS.txt
            ${{ runner.temp }}/out/LICENSE-AUDIT.txt
            ${{ runner.temp }}/out/contrib-config.mak
            ${{ runner.temp }}/out/vlc-configure-invocation.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-${{ matrix.abi }}-${{ inputs.license }}
          path: ${{ runner.temp }}/out/build.log.gz
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the corresponding source
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corresponding-source-${{ matrix.abi }}-${{ inputs.license }}
          path: ${{ runner.temp }}/out/source
          if-no-files-found: ignore
          retention-days: 90

  assemble:
    name: Assemble one AAR and release
    needs: [plan, build]          # runs only when every ABI built and passed its audit
    if: inputs.abi == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write             # release step only, after the assembly and its audit
    env:
      LICENSE_FLAG: ${{ inputs.license }}
      VERSION: "3.7.0"
    steps:
      - name: Checkout the recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the three builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-${{ inputs.license }}"
          path: ${{ runner.temp }}/in

      - name: Assemble (one classes.jar, jni/ of every ABI) and audit
        run: |
          set -euo pipefail
          IN="$RUNNER_TEMP/in"; ARGS=()
          for abi in arm64-v8a armeabi-v7a x86_64; do
            d="$IN/build-$abi"; mkdir -p "$d"
            cp -r "$IN/libvlc-lgpl-$abi-$LICENSE_FLAG/." "$d/"
            mkdir -p "$d/source"
            cp -r "$IN/corresponding-source-$abi-$LICENSE_FLAG/." "$d/source/"
            ARGS+=(--abi "$abi=$d")
          done
          python3 scripts/assemble_release.py --out "$RUNNER_TEMP/release" --license "$LICENSE_FLAG" \
            --version "$VERSION" "${ARGS[@]}"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "### libvlc LGPL ${VERSION}, license ${LICENSE_FLAG}, one AAR for three ABIs"
            if [ -f "$RUNNER_TEMP/release/SHA256SUMS" ]; then
              echo '```'; cat "$RUNNER_TEMP/release/SHA256SUMS"; echo '```'
            else
              echo "No assembly: at least one ABI failed its build or audit, or the classes.jar differ."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the assembled release files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-${{ inputs.license }}
          path: ${{ runner.temp }}/release
          if-no-files-found: warn
          retention-days: 90

      - name: Publish the release (three audits passed)
        if: success() && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          REL="$RUNNER_TEMP/release"
          aar_name="libvlc-lgpl-${VERSION}-${LICENSE_FLAG}.aar"
          for abi in arm64-v8a armeabi-v7a x86_64; do   # never release without three passing audits
            grep -q '^PASS' "$REL/LICENSE-AUDIT-$abi-$LICENSE_FLAG.txt"
          done
          grep -q '^PASS' "$REL/LICENSE-AUDIT-aar-$LICENSE_FLAG.txt"
          if [ -n "$TAG_INPUT" ]; then
            tag="$TAG_INPUT"
          else
            last=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | sed -n "s/^v${VERSION}-lgpl\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n 1)
            tag="v${VERSION}-lgpl.$(( ${last:-0} + 1 ))"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists: refusing to overwrite it" >&2; exit 1
          fi
          aar_sha=$(sha256sum "$REL/$aar_name" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          LibVLC ${VERSION} for Android without GPL components (libvlcjni 7cd0c151, VLC 3458be16): one AAR for arm64-v8a, armeabi-v7a and x86_64.

          | file | sha256 |
          |---|---|
          | \`${aar_name}\` (license flag ${LICENSE_FLAG}) | \`${aar_sha}\` |

          Stable URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${aar_name}

          Published only because the three per-ABI audits and the audit of the assembled AAR passed (LICENSE-AUDIT-*.txt). BUILD-INFO.txt groups the three builds; SHA256SUMS covers every file.
          Corresponding source: vlc-*-patched-<abi>.tar.xz, libvlcjni-*-patched-<abi>.tar.xz and contrib-tarballs-<abi>.tar. Build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$tag" "$REL"/* --target "$GITHUB_SHA" \
            --title "libvlc ${VERSION} LGPL (${tag})" --notes-file "$RUNNER_TEMP/notes.md"
          echo "release: $tag" | tee -a "$GITHUB_STEP_SUMMARY"
